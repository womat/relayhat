definitions:
  app.HTTPResponse:
    properties:
      description:
        type: string
      name:
        type: string
      state:
        type: string
    type: object
  health.Model:
    properties:
      app:
        description: Application name (MODULE)
        type: string
      appVersion:
        description: Current version of the application
        type: string
      goVersion:
        description: Go runtime version
        type: string
      heapAllocBytes:
        description: Allocated heap memory in bytes
        type: integer
      hostname:
        description: Machine name where the app runs
        type: string
      numGoroutines:
        description: Current number of active goroutines
        type: integer
      os:
        description: Operating system name
        type: string
      sysMemoryBytes:
        description: Total memory obtained from the OS
        type: integer
      timestamp:
        description: UTC timestamp when health info was collected (RFC3339)
        type: string
      uptimeSeconds:
        description: Application uptime in seconds
        type: number
    type: object
info:
  contact: {}
paths:
  /health:
    get:
      description: Retrieves memory usage, goroutine count, version, hostname, Go
        runtime version, and OS.
      produces:
      - application/json
      responses:
        "200":
          description: Health data successfully retrieved
          schema:
            $ref: '#/definitions/health.Model'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get health data
      tags:
      - info
  /relays:
    get:
      description: Returns name, state (on/off) and description for every configured
        relay.
      produces:
      - application/json
      responses:
        "200":
          description: List of all relays
          schema:
            items:
              $ref: '#/definitions/app.HTTPResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List all relays
      tags:
      - relay
  /relays/{name}:
    get:
      description: Returns name, state (on/off) and description for the given relay.
      parameters:
      - description: Relay name (e.g. relay1)
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Relay state
          schema:
            $ref: '#/definitions/app.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Relay not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get relay state
      tags:
      - relay
  /relays/{name}/{state}:
    put:
      description: Sets the state of a specific relay by name.
      parameters:
      - description: Relay name
        in: path
        name: name
        required: true
        type: string
      - description: Relay state (on/off)
        in: path
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Relay state successfully set
          schema:
            $ref: '#/definitions/app.HTTPResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Relay not found
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Set relay state
      tags:
      - relays
  /version:
    get:
      description: Returns the current application name and version. No authentication
        required.
      produces:
      - application/json
      responses:
        "200":
          description: Application version and name
          schema:
            properties:
              app:
                type: string
              appVersion:
                type: string
            type: object
      summary: Get application version and name
      tags:
      - info
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
